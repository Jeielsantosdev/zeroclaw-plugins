name = "x402-settle"
version = "0.1.0"
description = "Pay for an x402-gated resource: validates payment requirements, enforces a cumulative 24h spend cap recomputed from real on-chain transfer history, and signs an SPL token transfer with a scoped session key. Never touches the operator's main wallet key. T2."
author = "ZeroClaw Labs"
wasm_path = "x402_settle.wasm"
capabilities = ["tool"]
# http_client: fetch the 402 challenge, fetch the session account's recent
# transfer history (for the cumulative cap), and retry with PAYMENT-SIGNATURE.
# config_read: the host injects this plugin's own config section (policy
# thresholds and the session key material) as `__config`.
permissions = ["http_client", "config_read"]
