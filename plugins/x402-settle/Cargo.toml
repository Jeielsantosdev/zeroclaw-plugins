[package]
name = "x402-settle"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ZeroClaw WIT plugin: pay for an x402-gated resource under a scoped session key and a real on-chain-derived spend cap (T2)."
publish = false

# cdylib for the wasm component; rlib so the pure policy/signing core is
# testable on the host with a plain `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
# default-features off: no rand_core/getrandom needed, signing is deterministic.
# "zeroize" scrubs the session key bytes from memory once the SigningKey drops.
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "zeroize"] }

[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
overflow-checks = true

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
# Deliberately does NOT depend on ../x402-quote-check via a path dependency:
# the official CI validator snapshots only this plugin's own directory in
# isolation (tools/ci/validate_components.sh), so a sibling path dependency
# would not resolve there. The requirement-validation logic is duplicated
# here instead — see src/x402_settle.rs, "Why this duplicates quote-check".
[workspace]
