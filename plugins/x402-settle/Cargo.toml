[package]
name = "x402-settle"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ZeroClaw WIT plugin: pay for an x402-gated resource under a scoped session key and a real on-chain-derived spend cap (T2)."
publish = false

# cdylib for the wasm component; rlib so the pure policy/signing core is
# testable on the host with a plain `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
# default-features off: no rand_core/getrandom needed, signing is deterministic.
# "zeroize" scrubs the session key bytes from memory once the SigningKey drops.
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "zeroize"] }
# Used directly (not just transitively via ed25519-dalek) to scrub the raw
# session-key seed bytes and the config String that carries them — see
# decode_session_key_seed and lib.rs's use of Zeroizing.
zeroize = "1"
# alloc-only: no std-only extras needed to base64-encode the signed transaction.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
# Already resolved transitively via ed25519-dalek (same versions pinned in
# Cargo.lock); declared directly here too because associated_token.rs uses
# both for real Associated Token Account (PDA) derivation, not just signing.
curve25519-dalek = { version = "4.1", default-features = false }
sha2 = { version = "0.10", default-features = false }
# Modular Solana crates — confirmed (2026-07-27) to compile clean to
# wasm32-wasip2, and explicitly preferred by EDITAL.md over hand-rolled byte
# encoding ("no hand-rolled byte encoding needed to build and serialize
# transactions... prefer the modular crates"). Used for correct message
# compilation (account ordering, dedup) and the exact instruction shapes
# (ComputeBudget, TransferChecked) real x402 v2 Solana servers require — see
# transaction.rs.
solana-pubkey = "3.0.0"
solana-instruction = "3.5.0"
solana-message = { version = "4.4.0", features = ["serde"] }
solana-transaction = { version = "4.1.5", features = ["serde"] }
solana-hash = "4.6.0"
solana-compute-budget-interface = "3.0.0"
solana-signature = "3.5.0"
# no-entrypoint: this plugin only builds instructions, never runs on-chain
# program code — the entrypoint machinery isn't needed and doesn't belong in
# a wasm component.
spl-token = { version = "9.0.0", default-features = false, features = ["no-entrypoint"] }
# Solana's own wire format for Message/Transaction is bincode — required to
# get message_bytes to sign and to produce the final wire-format bytes.
bincode = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
overflow-checks = true

# Standalone crate: built for wasm32-wasip2, not part of the host workspace.
# Deliberately does NOT depend on ../x402-quote-check via a path dependency:
# the official CI validator snapshots only this plugin's own directory in
# isolation (tools/ci/validate_components.sh), so a sibling path dependency
# would not resolve there. The requirement-validation logic is duplicated
# here instead — see src/x402_settle.rs, "Why this duplicates quote-check".
[workspace]
